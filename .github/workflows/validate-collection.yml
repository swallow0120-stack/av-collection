name: Validate and publish collection
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/build_site.py'
      - 'validate_collection.py'
      - 'tests/**'
      - 'assets/**'
      - 'manage.html'
      - 'index.html'
      - '.github/workflows/validate-collection.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - run: python validate_collection.py
      - run: python scripts/build_site.py --check
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html manage.html _site/
          cp -R assets _site/
          cp data/catalog.json data/migration-baseline.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
