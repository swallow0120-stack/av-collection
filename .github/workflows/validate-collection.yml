name: Validate collection integrity

on:
  push:
    branches: [main]
    paths:
      - index.html
      - collection-baseline.json
      - validate_collection.py
      - .github/workflows/validate-collection.yml
  pull_request:
    paths:
      - index.html
      - collection-baseline.json
      - validate_collection.py
      - .github/workflows/validate-collection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python validate_collection.py
